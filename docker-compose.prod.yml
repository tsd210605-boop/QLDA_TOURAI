# Khai báo các container production, kết nối Gateway với các dịch vụ và cấu hình MySQL cho từng schema nghiệp vụ.

name: tourism-application

services:
  mysql:
    image: mysql:8
    restart: always

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth-service:
    build: ./Backend/auth-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build: ./Backend/booking-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/bookings_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

  destination-service:
    build: ./Backend/destination-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/destinations_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

  packages-service:
    build: ./Backend/packages-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/packages_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build: ./Backend/api-gateway
    restart: always

    ports:
      - "8080:8080"

    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      DESTINATION_SERVICE_URL: http://destination-service:8083
      PACKAGES_SERVICE_URL: http://packages-service:8084

    depends_on:
      - auth-service
      - booking-service
      - destination-service
      - packages-service

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/backend}
    restart: always

    ports:
      - "3000:80"

    depends_on:
      - api-gateway

volumes:
  mysql_data:
