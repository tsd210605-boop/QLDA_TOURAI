server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/bookings/**,/api/admin/bookings/**,/payments/**,/invoices/**,/operations/**,/suppliers/**

        - id: destination-service
          uri: ${DESTINATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/destinations/**,/api/admin/destinations/**

        - id: package-service
          uri: ${PACKAGES_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/packages/**,/api/admin/packages/**,/admin/packages/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
